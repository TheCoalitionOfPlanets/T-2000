[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "t2000"
version = "0.1.0"
description = "Local voice cloning with cached enrollment and incremental phrase playback"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=1.26,<2",
  "scipy>=1.12,<2",
  "soundfile>=0.13,<1",
  "soxr>=0.5,<1",
]

[project.optional-dependencies]
stt = ["sherpa-onnx==2.0.1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
t2000 = "t2000.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/t2000"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
